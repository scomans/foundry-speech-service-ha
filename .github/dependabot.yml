version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The test dependencies are pinned to the Home Assistant release the integration targets.
      # Bump them together with it; security updates are still raised.
      - dependency-name: "pytest-homeassistant"
